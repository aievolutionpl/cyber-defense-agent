name: Cyber Defense Agent checks
on:
  push:
    branches: [codex/node-v0.1, codex/premium-unified]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run demo
      - run: node tools/cda.mjs onboarding --scope demo
      - run: node tools/cda.mjs summary --scope demo --report demo-before --name model-summary

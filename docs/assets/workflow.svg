<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">From scope to evidence</title><desc id="desc">A human approves exact files. Local review or report import produces redacted evidence. A human reviews the fix. Retest returns confirmed fixed, still present, or insufficient data. No target execution, network scanning, or automatic model call.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c17"/><stop offset="1" stop-color="#080d0b"/></linearGradient><linearGradient id="beam"><stop stop-color="#284c3b"/><stop offset=".5" stop-color="#b4eed2"/><stop offset="1" stop-color="#284c3b"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#21382c" stroke-width=".5"/></pattern></defs>
<rect width="1200" height="590" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="588" rx="23" fill="url(#grid)" stroke="#345240"/>
<g font-family="Arial,sans-serif"><text x="52" y="59" font-family="monospace" font-size="13" fill="#b4eed2" letter-spacing="3">CYBER DEFENSE AGENT / THE EVIDENCE CHAIN</text><text x="52" y="116" font-size="42" fill="#eef2e9" font-weight="700">From scope to evidence.</text><text x="52" y="151" font-size="17" fill="#a0afa5">Your agent guides the review. You control the boundaries.</text>
<path d="M120 271H1080" stroke="url(#beam)" stroke-width="2"/>
<g fill="#101b15" stroke="#365b44"><rect x="52" y="206" width="202" height="148" rx="12"/><rect x="276" y="206" width="202" height="148" rx="12"/><rect x="500" y="206" width="202" height="148" rx="12"/><rect x="724" y="206" width="202" height="148" rx="12"/><rect x="948" y="206" width="202" height="148" rx="12"/></g>
<g fill="#b4eed2" font-family="monospace" font-size="12"><text x="72" y="237">01 / HUMAN GATE</text><text x="296" y="237">02 / LOCAL TOOL</text><text x="520" y="237">03 / EVIDENCE</text><text x="744" y="237">04 / HUMAN REVIEW</text><text x="968" y="237">05 / VERIFICATION</text></g>
<g fill="#eef2e9" font-size="23" font-weight="700"><text x="72" y="280">Approve scope</text><text x="296" y="280">Review / import</text><text x="520" y="280">Read the report</text><text x="744" y="280">Assess the fix</text><text x="968" y="280">Retest</text></g>
<g fill="#a0afa5" font-size="14"><text x="72" y="310">Exact files. 24h expiry.</text><text x="296" y="310">Four rules or JSON/SARIF.</text><text x="520" y="310">Location. Priority. Confidence.</text><text x="744" y="310">Your development workflow.</text><text x="968" y="310">Current file + repeated rule.</text></g>
<path d="M1049 354V390H52" stroke="#365b44" fill="none"/>
<g font-family="monospace" font-size="13"><rect x="52" y="413" width="340" height="63" rx="8" fill="#14281d" stroke="#50785e"/><text x="76" y="440" fill="#b4eed2">confirmed_fixed</text><text x="76" y="461" fill="#a0afa5" font-size="12">Same local rule + fresh evidence</text><rect x="414" y="413" width="340" height="63" rx="8" fill="#211e15" stroke="#66583a"/><text x="438" y="440" fill="#ead6a7">still_present</text><text x="438" y="461" fill="#b6aa8e" font-size="12">The matching signal remains</text><rect x="776" y="413" width="374" height="63" rx="8" fill="#151c20" stroke="#3e5360"/><text x="800" y="440" fill="#bccfdc">insufficient_data</text><text x="800" y="461" fill="#a0afb9" font-size="12">Missing evidence is not a clean result</text></g>
<path d="M52 511H1150" stroke="#293e31"/><text x="52" y="548" fill="#a0afa5" font-family="monospace" font-size="12">NO TARGET EXECUTION  /  NO NETWORK SCAN  /  NO AUTOMATIC MODEL CALL</text><circle cx="1138" cy="544" r="5" fill="#b4eed2"/>
</g></svg>
